# Publica el sitio en GitHub Pages cada vez que hay cambios en la rama main.
# Requisito (una sola vez): Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: pages
        uses: actions/configure-pages@v5
      # Si definiste un dominio propio en site.config.mjs (site.url) se usa ese;
      # si sigue el de ejemplo, se usa la dirección que asigna GitHub Pages.
      - name: Generar y revisar el sitio
        run: |
          if grep -q "url: 'https://www.example.com'" site.config.mjs; then
            export SITE_URL="${{ steps.pages.outputs.base_url }}"
          fi
          npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
